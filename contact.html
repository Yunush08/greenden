<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenden</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <nav class="bg-green-100 p-3 flex justify-between items-center shadow-xl sticky top-0 z-10">
        <h1 class="text-2xl">GREENDEN</h1>

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
            class="w-6 md:hidden">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>

        <ul class="flex gap-4 text-gray-600 hidden md:flex">
            <li>
                <a class="hover:underline hover:text-black" href="./index.html">Home</a>
            </li>
            <li>
                <a class="hover:underline hover:text-black" href="./products.html">Products</a>
            </li>
            <li>
                <a class="hover:underline hover:text-black" href="./contact.html">Contact</a>
            </li>
        </ul>
    </nav>

    <form action="#" class="mx-auto max-w-md space-y-4 rounded-lg border border-gray-300 bg-gray-100 p-6 my-5">
        <div>
            <label class="block text-sm font-medium text-gray-900" for="name">Name</label>

            <input class="mt-1 w-full rounded-lg border-gray-300 focus:border-indigo-500 focus:outline-none" id="name"
                type="text" placeholder="Your name" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-900" for="email">Email</label>

            <input class="mt-1 w-full rounded-lg border-gray-300 focus:border-indigo-500 focus:outline-none" id="email"
                type="email" placeholder="Your email" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-900" for="message">Message</label>

            <textarea
                class="mt-1 w-full resize-none rounded-lg border-gray-300 focus:border-indigo-500 focus:outline-none"
                id="message" rows="4" placeholder="Your message"></textarea>
        </div>

        <button
            class="block w-full rounded-lg border border-indigo-600 bg-indigo-600 px-12 py-3 text-sm font-medium text-white transition-colors hover:bg-transparent hover:text-indigo-600"
            type="submit">
            Send Message
        </button>
    </form>

    <div class="bg-green-100 flex flex-col gap-5 p-5">
        <h1 class="text-3xl font-bold">Greenden</h1>
        <p>The Standard chunk of Lorem ipsum used since the 1500s is reproduced below for those interest</p>
        <p>@ 2021 Greenden.com</p>
    </div>

</body>

</html>
